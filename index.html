<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Game — Charizard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div class="stage">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="attack-menu" class="attack-menu hidden" role="dialog" aria-label="Menú de ataques">
        <h2 class="attack-menu__title">Ataques</h2>
        <ul class="attack-menu__list" id="attack-menu-list"></ul>
        <p class="attack-menu__hint">W/S o ↑/↓ · Enter: usar · Esc/Tab: cerrar</p>
      </div>
    </div>
    <p class="hint">Mover: <strong>WASD</strong> o <strong>flechas</strong> · <strong>J</strong>: Golpe · <strong>Tab</strong>: ataques</p>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
